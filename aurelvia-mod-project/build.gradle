plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.version
group = project.maven_group

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"aurelvia_machines" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

/**
 * Derleme sinif yolundaki (Minecraft + Fabric API) siniflarin imzalarini yazdirir.
 * tools/api-classes.txt icindeki siniflar javap ile dokulur.
 * Kullanim: ./gradlew apiDump
 */
tasks.register('apiDump') {
	def classesFile = file('tools/api-classes.txt')
	doLast {
		if (!classesFile.exists()) {
			println 'apiDump: tools/api-classes.txt yok'
			return
		}
		def names = classesFile.readLines()
				.collect { it.trim() }
				.findAll { it && !it.startsWith('#') }
		if (names.isEmpty()) {
			println 'apiDump: sinif listesi bos'
			return
		}

		def classpath = null
		try {
			classpath = sourceSets.client.compileClasspath.asPath
		} catch (Throwable ignored) {
			classpath = sourceSets.main.compileClasspath.asPath
		}

		println '==== API DUMP BASLANGIC ===='
		def result = exec {
			commandLine(['javap', '-public', '-classpath', classpath] + names)
			ignoreExitValue = true
		}
		println '==== API DUMP SONU ==== (exit=' + result.exitValue + ')'
	}
}
